<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS</title>
<meta name="theme-color" content="#030a14">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#030a14;--bg2:#08233f;--c:#7fe3ff;--c2:#3aa8e0;--dim:#6f9bb8;--line:#12456b;--ink:#dff6ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(90% 50% at 50% 14%,#0d3a66 0%,var(--bg2) 35%,var(--bg) 80%);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari","Noto Nastaliq Urdu",Roboto,sans-serif;display:flex;flex-direction:column}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#7fe3ff08 0 1px,transparent 1px 4px)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:18px;font-weight:300;letter-spacing:.5em;color:var(--c);text-shadow:0 0 12px var(--c2)}
#gear{border:1px solid var(--line);border-radius:6px;padding:6px 10px;color:var(--c);font-size:13px}
#hud{display:flex;flex-direction:column;align-items:center;padding:8px 0 2px}
#orb{width:150px;height:150px;border-radius:50%}
#orb svg{width:100%;height:100%;overflow:visible}
.g{transform-origin:center;transform-box:fill-box}
.r1{animation:sp 28s linear infinite}.r2{animation:sp 18s linear infinite reverse}.r3{animation:sp 40s linear infinite}
.core{transform-origin:center;transform-box:fill-box}
#orb.listen .core{animation:pu 1s ease-in-out infinite}
#orb.speak .core{animation:pu .45s ease-in-out infinite}
#orb.think .r2{animation-duration:2.5s}
#orb.listen svg,#orb.speak svg{filter:drop-shadow(0 0 14px var(--c))}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pu{50%{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.g,.core{animation:none!important}}
#status{font-size:12px;color:var(--dim);letter-spacing:.12em;margin-top:2px;min-height:16px}
#chat{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:12px}
.m{max-width:88%;padding:10px 13px;border-radius:10px;line-height:1.55;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;background:#3aa8e022;border:1px solid var(--line)}
.a{align-self:flex-start;background:#08233fcc;border-left:2px solid var(--c);padding-bottom:6px}
.acts{display:flex;gap:2px;margin-top:6px;white-space:normal}
.acts button{width:36px;height:32px;border-radius:6px;font-size:15px;opacity:.7}
.acts button:hover,.acts button.on{opacity:1;background:#3aa8e033}
.perm{align-self:flex-start;max-width:92%;border:1px solid var(--c);border-radius:10px;padding:12px;background:#08233f;box-shadow:0 0 18px #7fe3ff33}
.perm p{margin:0 0 10px}
.perm button{border:1px solid var(--c);border-radius:6px;padding:8px 12px;margin-right:8px;color:var(--c)}
.perm button.no{border-color:var(--line);color:var(--dim)}
.m img{max-width:100%;border-radius:8px;display:block}
#bar{display:flex;gap:6px;align-items:center;padding:8px 12px 12px;border-top:1px solid var(--line)}
#txt{flex:1;min-width:0;background:#08233f99;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:12px 14px;font:inherit}
#txt:focus,button:focus-visible,#set :focus-visible{outline:2px solid var(--c);outline-offset:2px}
#send,#mic{width:46px;height:46px;border:1px solid var(--c2);border-radius:8px;color:var(--c);font-size:19px}
#set{position:fixed;inset:0;background:#030a14f2;display:none;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 24px}
#set.open{display:block}
#set label{display:block;margin:14px 0 4px;color:var(--dim);font-size:13px}
#set input,#set textarea,#set select{width:100%;background:#08233f;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:10px;font:inherit}
#set textarea{min-height:70px}
.sb{border:1px solid var(--c2);border-radius:8px;padding:9px 14px;color:var(--c);margin-right:8px}
.note{color:var(--dim);font-size:12px;margin-top:16px;line-height:1.5}
</style>
</head>
<body>
<header><h1 id="title">JARVIS</h1><button id="gear">Settings</button></header>
<div id="hud">
<button id="orb" aria-label="Tap to speak">
<svg viewBox="0 0 200 200" fill="none">
<defs><radialGradient id="cg"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#7fe3ff"/><stop offset="1" stop-color="#3aa8e000"/></radialGradient></defs>
<g class="g r1"><circle cx="100" cy="100" r="94" stroke="#3aa8e0" stroke-width="1.5" stroke-dasharray="3 7"/></g>
<g class="g r2"><circle cx="100" cy="100" r="80" stroke="#7fe3ff" stroke-width="3" stroke-dasharray="70 30 20 30"/></g>
<g class="g r3"><circle cx="100" cy="100" r="64" stroke="#3aa8e0" stroke-width="9" stroke-dasharray="7 9" opacity=".7"/></g>
<circle cx="100" cy="100" r="50" stroke="#7fe3ff" stroke-width="1.5"/>
<g class="core"><circle cx="100" cy="100" r="40" fill="url(#cg)"/></g>
<polygon points="100,78 119,111 81,111" stroke="#fff" stroke-width="1.5" opacity=".8"/>
</svg>
</button>
<div id="status">TAP THE CORE TO SPEAK</div>
</div>
<div id="chat"></div>
<div id="bar">
<input id="txt" placeholder="Type to Jarvis" autocomplete="off">
<button id="mic" aria-label="Speak">🎙</button>
<button id="send" aria-label="Send">➤</button>
</div>
<div id="set">
<h2 style="margin:0 0 4px;color:var(--c);font-weight:300">Settings</h2>
<label>Assistant name</label><input id="sName">
<label>AI provider</label><select id="sProv"><option value="gemini">Google Gemini (free key)</option><option value="claude">Anthropic Claude (paid key)</option></select>
<label>API key (stored only on this phone)</label><input id="sKey" type="password" autocomplete="off">
<label>Model name</label><input id="sModel" autocomplete="off">
<label>ElevenLabs API key (optional, for a natural voice)</label><input id="sEk" type="password" autocomplete="off">
<label>ElevenLabs Voice ID</label><input id="sEv" autocomplete="off">
<label>Personality</label><textarea id="sPers"></textarea>
<label>Language (voice and replies)</label>
<select id="sLang"><option value="hi-IN">हिन्दी</option><option value="en-US">English</option><option value="ur-PK">اردو</option></select>
<label>My rules (one per line)</label><textarea id="sRules" placeholder="e.g. Always answer briefly"></textarea>
<label>Blocked topics</label><textarea id="sBlock"></textarea>
<label><input type="checkbox" id="sSpeak" style="width:auto"> Speak every reply aloud</label>
<div style="margin-top:18px"><button class="sb" id="save">Save and close</button><button class="sb" id="wipe">Clear chat</button></div>
<p class="note">This prototype cannot read your phone. It asks permission every time before any action, default "Only this time". The "Hey Jarvis" wake word needs the Android app, the next phase.</p>
</div>
<script>
const $=id=>document.getElementById(id),orb=$("orb");
let S={name:"Jarvis",pers:"Smart, calm and to the point, like a loyal assistant. Gives practical ideas and next steps.",lang:"hi-IN",rules:"",block:"",speak:true,key:"",prov:"gemini",model:"gemini-flash-latest",elKey:"",elVoice:""};
try{Object.assign(S,JSON.parse(localStorage.getItem("jarvis")||"{}"))}catch(e){}
let hist=[],busy=false,sample=null,cur=null,rec=null,audio=null,elWarned=false;

function st(t){$("status").textContent=t}
function applyS(){$("title").textContent=S.name.toUpperCase();document.title=S.name;$("sName").value=S.name;$("sKey").value=S.key||"";$("sProv").value=S.prov;$("sModel").value=S.model;$("sEk").value=S.elKey||"";$("sEv").value=S.elVoice||"";$("sPers").value=S.pers;$("sLang").value=S.lang;$("sRules").value=S.rules;$("sBlock").value=S.block;$("sSpeak").checked=S.speak}
applyS();
function bub(cls,t){const d=document.createElement("div");d.className="m "+cls;const s=document.createElement("span");s.textContent=t;d.appendChild(s);$("chat").appendChild(d);$("chat").scrollTop=1e9;return d}
function copyTxt(t){try{navigator.clipboard.writeText(t).catch(()=>fb())}catch(e){fb()}function fb(){const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy")}catch(e){}x.remove()}}
function stopSp(){if(window.speechSynthesis)speechSynthesis.cancel();if(audio){audio.pause();audio=null}cur=null;orb.classList.remove("speak");st("READY")}
function speak(text,btn){
 if(!(S.elKey&&S.elVoice))return speakBrowser(text,btn);
 const same=cur===btn;stopSp();if(same)return;
 cur=btn;orb.classList.add("speak");st("SPEAKING");
 fetch("https://api.elevenlabs.io/v1/text-to-speech/"+encodeURIComponent(S.elVoice)+"?output_format=mp3_44100_128",{method:"POST",headers:{"xi-api-key":S.elKey,"content-type":"application/json"},body:JSON.stringify({text:text.slice(0,500),model_id:"eleven_multilingual_v2"})})
 .then(r=>{if(!r.ok)throw r.status;return r.blob()})
 .then(b=>{if(cur!==btn)return;audio=new Audio(URL.createObjectURL(b));audio.onended=()=>{if(cur===btn)stopSp()};return audio.play()})
 .catch(e=>{if(cur!==btn)return;stopSp();if(!elWarned){elWarned=true;bub("a","ElevenLabs voice failed (code "+e+"). Check the key, the Voice ID and your free credits in Settings. Using the phone voice for now.")}speakBrowser(text,btn)});
}
function speakBrowser(text,btn){
 if(!window.speechSynthesis){st("VOICE NOT SUPPORTED HERE");return}
 const same=cur===btn;stopSp();if(same)return;
 cur=btn;orb.classList.add("speak");st("SPEAKING");
 const vs=speechSynthesis.getVoices(),v=vs.find(x=>x.lang.replace("_","-").toLowerCase().startsWith(S.lang.slice(0,2)));
 if(!v&&vs.length)st("NO "+S.lang+" VOICE INSTALLED, USING DEFAULT");
 const ch=text.split(/(?<=[.!?।۔\n])\s*/).filter(x=>x.trim());
 ch.forEach((c,i)=>{const u=new SpeechSynthesisUtterance(c);u.lang=S.lang;if(v)u.voice=v;if(i===ch.length-1)u.onend=u.onerror=()=>{if(cur===btn)stopSp()};speechSynthesis.speak(u)});
}
function acts(b,text){
 const a=document.createElement("div");a.className="acts";
 const mk=(ic,lb,fn)=>{const x=document.createElement("button");x.textContent=ic;x.setAttribute("aria-label",lb);x.onclick=()=>fn(x);a.appendChild(x);return x};
 mk("⧉","Copy",x=>{copyTxt(text);x.textContent="✓";setTimeout(()=>x.textContent="⧉",1200)});
 mk("⇪","Share",()=>{if(navigator.share)navigator.share({text}).catch(()=>{});else copyTxt(text)});
 const v=mk("🔊","Read aloud",x=>speak(text,x));
 const up=mk("👍","Like",x=>{x.classList.toggle("on");dn.classList.remove("on")});
 const dn=mk("👎","Dislike",x=>{x.classList.toggle("on");up.classList.remove("on")});
 mk("↻","Try again",()=>{if(busy)return;stopSp();b.remove();if(hist.length&&hist[hist.length-1].role==="assistant")hist.pop();reply()});
 b.appendChild(a);return v;
}
const PHOTO=/photo|picture|gallery|फ़ोटो|फोटो|गैलरी|تصویر|گیلری/i;
function askPerm(){
 const d=document.createElement("div");d.className="perm";
 d.innerHTML="<p></p><button>Only this time</button><button class='no'>Don't allow</button>";
 d.querySelector("p").textContent=S.name+" wants to open your photo picker. Allow?";
 const [y,n]=d.querySelectorAll("button");
 y.onclick=()=>{d.remove();const f=document.createElement("input");f.type="file";f.accept="image/*";
  f.onchange=()=>{const x=f.files[0];if(!x)return;const m=bub("a","");const i=document.createElement("img");i.src=URL.createObjectURL(x);m.appendChild(i)};f.click()};
 n.onclick=()=>{d.remove();bub("a","Okay, I won't open it.")};
 $("chat").appendChild(d);$("chat").scrollTop=1e9;
}
async function reply(){
 if(!S.key){bub("a","Open Settings and add your API key first.");return}
 busy=true;orb.classList.add("think");st("THINKING");
 const sys="You are "+S.name+", the user's personal AI assistant on their phone. Personality: "+S.pers+". Reply in the user's language (default "+S.lang+"). Write plain text only, no markdown, symbols or emojis, because your answer is read aloud. Keep answers short. If asked for a video idea, give one idea and the steps to make it. You cannot access phone data; actions need the user's permission. User rules:\n"+S.rules+"\nNever discuss: "+S.block+"\n\nConversation:\n"+hist.slice(-12).map(m=>(m.role==="user"?"User: ":"Assistant: ")+m.content).join("\n")+"\nAssistant:";
 const out=bub("a","…"),t=out.firstChild;
 try{let r;
  if(S.prov==="gemini"){
   const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(S.model||"gemini-flash-latest")+":generateContent",{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":S.key},body:JSON.stringify({contents:[{role:"user",parts:[{text:sys}]}]})});
   const j=await res.json();if(!res.ok)throw{code:res.status,msg:j.error&&j.error.message};
   r={text:((j.candidates||[{}])[0].content||{parts:[]}).parts.map(p=>p.text||"").join("")};
  }else{
   const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":S.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:S.model||"claude-sonnet-5-5",max_tokens:700,messages:[{role:"user",content:sys}]})});
   const j=await res.json();if(!res.ok)throw{code:res.status,msg:j.error&&j.error.message};
   r={text:j.content.map(c=>c.text||"").join("")};
  }
  t.textContent=r.text;hist.push({role:"assistant",content:r.text});const v=acts(out,r.text);if(S.speak)speak(r.text,v);else st("READY")}
 catch(e){t.textContent=(e.code===400||e.code===401||e.code===403)?"The key or model name is not accepted. Check both in Settings. "+(e.msg||""):e.code===429?"Too many requests. Wait a minute and try again.":"Something went wrong. "+(e.msg||"Check your internet and try again.");st("READY")}
 orb.classList.remove("think");busy=false;
}
function ask(text){
 if(!text.trim()||busy)return;stopSp();bub("u",text);$("txt").value="";
 if(PHOTO.test(text)){askPerm();return}
 hist.push({role:"user",content:text});reply();
}
function unlock(){if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}}
$("send").onclick=()=>{unlock();ask($("txt").value)};
$("txt").onkeydown=e=>{if(e.key==="Enter"){unlock();ask($("txt").value)}};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function mic(){
 unlock();
 if(cur){stopSp();return}
 if(!SR){bub("a","Voice input is not supported in this browser. Try Chrome on Android.");return}
 if(rec){rec.stop();return}
 rec=new SR();rec.lang=S.lang;
 rec.onstart=()=>{orb.classList.add("listen");st("LISTENING")};
 rec.onresult=e=>ask(e.results[0][0].transcript);
 rec.onend=()=>{rec=null;orb.classList.remove("listen");if(!busy&&!cur)st("READY")};
 rec.onerror=()=>st("MIC NOT ALLOWED OR NOT HEARD");rec.start();
}
orb.onclick=mic;$("mic").onclick=mic;
$("gear").onclick=()=>$("set").classList.add("open");
$("sProv").onchange=()=>{$("sModel").value=$("sProv").value==="gemini"?"gemini-flash-latest":"claude-sonnet-5-5"};
$("save").onclick=()=>{S={name:$("sName").value||"Jarvis",pers:$("sPers").value,lang:$("sLang").value,rules:$("sRules").value,block:$("sBlock").value,speak:$("sSpeak").checked,key:$("sKey").value.trim(),prov:$("sProv").value,model:$("sModel").value.trim(),elKey:$("sEk").value.trim(),elVoice:$("sEv").value.trim()};
 try{localStorage.setItem("jarvis",JSON.stringify(S))}catch(e){}applyS();$("set").classList.remove("open")};
$("wipe").onclick=()=>{stopSp();hist=[];$("chat").innerHTML="";$("set").classList.remove("open")};
bub("a","Hello, I'm "+S.name+". How can I help?");
</script>
</body>
</html>
